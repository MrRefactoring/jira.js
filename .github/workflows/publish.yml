name: 🚀 Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'

permissions:
  contents: read

jobs:
  create-release:
    name: 📝 Create draft release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release-id: ${{ steps.create.outputs.result }}
    steps:
      - name: 🔄 Checkout repository
        uses: actions/checkout@v7

      - name: 📝 Create draft release from CHANGELOG
        id: create
        uses: actions/github-script@v9
        with:
          result-encoding: string
          script: |
            const fs = require('fs');
            const tag = context.ref.replace('refs/tags/', '');
            const version = tag.replace(/^v/, '');
            const changelog = fs.readFileSync('CHANGELOG.md', 'utf8');

            const escaped = version.replace(/\./g, '\\.');
            const match = changelog.match(
              new RegExp(`## ${escaped}(?![0-9.])[^\\n]*\\n([\\s\\S]*?)(?=\\n## |$)`)
            );
            const body = match ? match[1].trim() : '<!-- changelog section not found -->';

            // A dash after the patch number is what semver calls a prerelease, and it is
            // the same signal the publish job reads to pick the npm dist-tag. Keeping both
            // derived from the tag means the two can never disagree about what a release is.
            const prerelease = version.includes('-');

            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              name: tag,
              body,
              draft: true,
              prerelease,
            });

            return data.id;

  publish:
    name: 🚀 Publish to NPM
    needs: create-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: 🔄 Checkout repository
        uses: actions/checkout@v7

      - name: 📦 Install pnpm
        uses: pnpm/action-setup@v6

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
          cache: pnpm

      - name: 📌 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 🔖 Verify version matches tag, and pick the dist-tag
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag v$TAG_VERSION does not match package.json version $PKG_VERSION. Bump package.json before tagging."
            exit 1
          fi
          case "$TAG_VERSION" in
            *-*) NPM_TAG=next ;;
            *)   NPM_TAG=latest ;;
          esac
          echo "NPM_TAG=$NPM_TAG" >> "$GITHUB_ENV"
          echo "Publishing $PKG_VERSION under the '$NPM_TAG' dist-tag."

      - name: 🛠️ Build
        run: pnpm run build

      - name: 🔍 Lint
        run: pnpm run lint
        env:
          CI: true

      - name: 🧪 Unit tests
        run: pnpm run test

      - name: 📤 Publish to NPM
        run: pnpm publish --provenance --access public --no-git-checks --tag "$NPM_TAG"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: ✅ Activate GitHub release (un-draft)
        uses: actions/github-script@v9
        env:
          RELEASE_ID: ${{ needs.create-release.outputs.release-id }}
        with:
          script: |
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: parseInt(process.env.RELEASE_ID, 10),
              draft: false,
            });
